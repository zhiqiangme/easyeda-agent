name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CLI, connector and Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Test and build CLI
        run: |
          make test
          make build
      - name: Validate Skill and release helpers
        run: |
          make lint-test
          make release-script-test
          make skill-check
          npx --yes skills-ref@latest validate skills/easyeda-agent
      - name: Test and build connector
        run: |
          npm --prefix extension ci --ignore-scripts
          npm --prefix extension run typecheck
          npm --prefix extension test
          npm --prefix extension run build
